api_version = "2026-04"

[[extensions]]
name = "Cellexia Checkout Trust"
handle = "cellexia-checkout-trust"
type = "ui_extension"
uid = "419757f0-789f-d169-ffa6-a9276f7489a4d79a4ba7"
description = "Compact trust module V2 (guarantee, secure checkout, per-market customs-free + tracked-delivery rows, Trustpilot) rendered as a checkout block."

  # Merchant-positioned block placement (drag anywhere in the editor).
  [[extensions.targeting]]
  module = "./src/BlockRender.tsx"
  target = "purchase.checkout.block.render"

  # Alternative static placement adjacent to the Pay button (rendered
  # immediately before the actions area). Same shared UI (./src/Extension.tsx)
  # — the merchant chooses either placement in the checkout editor. Split into
  # its own entry module because the web-components architecture (post
  # React removal) has no documented way for one module to export render
  # functions for two different targets — each [[extensions.targeting]]
  # entry gets its own module per the documented one-to-one module/target
  # pattern, per https://shopify.dev/docs/api/checkout-ui-extensions/2026-07/configuration.
  [[extensions.targeting]]
  module = "./src/ActionsRenderBefore.tsx"
  target = "purchase.checkout.actions.render-before"

  [extensions.capabilities]
  api_access = true

  [[extensions.metafields]]
  namespace = "$app:cellexia"
  key = "config"
