# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2aadc2719a5bc649804cb42c0cbb917c"
name = "cellexia-aov-ltv-booster"
application_url = "https://cellexia-aov-ltv-booster.onrender.com"
embedded = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  # v14/v15 rewards: gift-stock watcher (debounced per shop; acts only when the
  # inventory item belongs to a gift/sample variant).
  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory/update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_inventory,read_locales,read_locations,read_markets,read_metaobject_definitions,read_metaobjects,read_orders,read_products,read_publications,read_shipping,read_themes,read_translations,write_discounts,write_files,write_markets,write_metaobject_definitions,write_metaobjects,write_products,write_publications,write_translations"

[auth]
redirect_urls = [
  "https://cellexia-aov-ltv-booster.onrender.com/auth/callback",
  "https://cellexia-aov-ltv-booster.onrender.com/auth/shopify/callback",
  "https://cellexia-aov-ltv-booster.onrender.com/api/auth/callback"
]

[app_proxy]
url = "https://cellexia-aov-ltv-booster.onrender.com/proxy"
subpath = "cellexia"
prefix = "apps"

[build]
automatically_update_urls_on_dev = false
